[project]
name = "openvols"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Brian Curtin", email = "brian.curtin@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "black>=26.5.1",
    "fastapi[standard]>=0.141.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-distro>=0.65b0",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-instrumentation-asyncpg>=0.65b0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "phonenumbers>=9.0.37",
    "pre-commit>=4.6.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.1",
    "structlog>=26.1.0",
    "yoyo-migrations>=9.0.0",
]

[project.scripts]
ov-api = "openvols.api.__main__:main"
ov-notifications = "openvols.notifications.__main__:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.165.10",
    "pytest-asyncio>=1.4.0",
    "pytest-env>=1.7.0",
    "ruff>=0.16.1",
    "ty>=0.0.74",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false

[tool.ruff.lint]
extend-select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
]

[tool.coverage.run]
source = ["src/openvols"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
env = [
    "OTEL_SDK_DISABLED = true"
]

[tool.tox]
env_list = [
    { product = [["unit"],["3.14"]] },
    { product = [["data"],["3.14"]] },
    { product = [["ruff"],["3.14"]] },
    { product = [["ty"],["3.14"]] },
]
requires = ["tox-uv"]

[tool.tox.env_base.unit]
description = "Run pytest unit tests"
factors = [["3.14", "3.15"]]
runner = "uv-venv-lock-runner"
skip_install = true
set_env = {OTEL_SDK_DISABLED = "true"}
deps = [
    "pytest>=8",
]
commands = [
    ["pytest", { replace = "posargs", default = ["tests/unit"], extend = true }]
]

[tool.tox.env_base.data]
description = "Run pytest Postgres tests"
factors = [["3.14", "3.15"]]
runner = "uv-venv-lock-runner"
skip_install = true
allowlist_externals = ["docker", "./scripts/docker-ready"]
commands_pre = [
    ["docker", "compose", "up", "-d"],
    ["./scripts/docker-ready"],
    ["yoyo", "apply", "-c", { replace = "if", condition = "env.GITHUB_WORKFLOW", then = "yoyo-gh-workflow.ini", "else" = "yoyo-dev.ini"}, "-b"]
]
commands = [
    ["pytest", { replace = "posargs", default = ["tests/data"], extend = true }]
]
interrupt_post_commands = true  # try the post command after a CTRL-C
commands_post = [
    ["docker", "compose", "down"]
]

[tool.tox.env.ruff]
description = "Run the ruff linter"
factors = [["3.14", "3.15"]]
runner = "uv-venv-lock-runner"
skip_install = true
deps = ["ruff"]
commands = [["ruff", "check", { replace = "posargs", default = ["."], extend = true }]]

[tool.tox.env.ty]
description = "Run the ty type checker"
factors = [["3.14", "3.15"]]
runner = "uv-venv-lock-runner"
skip_install = true
deps = ["ty"]
commands = [["ty", "check", { replace = "posargs", default = ["."], extend = true }]]
