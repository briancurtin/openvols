[project]
name = "openvols"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Brian Curtin", email = "brian.curtin@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "black>=26.5.1",
    "fastapi[standard]>=0.141.1",
    "opentelemetry-distro>=0.65b0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "phonenumbers>=9.0.37",
    "pre-commit>=4.6.1",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "structlog>=26.1.0",
    "yoyo-migrations>=9.0.0",
]

[project.scripts]
ov-api = "openvols.api.__main__:main"
ov-notifications = "openvols.notifications.__main__:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false

[tool.ruff.lint]
extend-select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
]
