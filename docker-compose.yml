services:
  postgres:
    container_name: postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openvols
      POSTGRES_PASSWORD: openvols
      POSTGRES_DB: openvols
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openvols"]
      interval: 2s
      timeout: 2s
      retries: 15
